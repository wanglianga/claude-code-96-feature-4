server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 健康检查（供 Docker HEALTHCHECK / 外部探活）
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 静态资源缓存
  location ~* \.(?:js|css|png|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
