services:
  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-day-surgery}-app
    ports:
      # 仅把应用服务发布到宿主；容器内部固定 8080（非 root nginx）
      - "${CC_PUBLISH_PORT:-3001}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
